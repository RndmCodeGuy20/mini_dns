receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: mini_dns
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets:
                - "${env:MINI_DNS_TARGET}"

processors:
  batch: {}

exporters:
  otlp_http/grafana_cloud:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:GRAFANA_OTLP_AUTH}

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [otlp_http/grafana_cloud]
